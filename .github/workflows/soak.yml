name: soak
# 10-minute heap/leak soak under 4x CPU throttle. Too slow for `npm run check`; run on demand or nightly.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Game slug to soak
        default: _template
      minutes:
        description: Soak length in minutes
        default: '10'
  schedule:
    - cron: '0 2 * * *'
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:soak -- ${{ inputs.slug || '_template' }}
        env:
          SOAK_MINUTES: ${{ inputs.minutes || '10' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-results
          path: test-results/
          retention-days: 14
