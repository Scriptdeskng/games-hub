<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Naija Games mock portal</title>
    <style>
      body {
        margin: 0;
        font:
          14px/1.4 system-ui,
          sans-serif;
        background: #111;
        color: #eee;
      }
      header,
      form {
        padding: 8px 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        background: #1c1c1c;
      }
      label {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      input,
      select,
      button {
        font: inherit;
        padding: 4px 8px;
      }
      main {
        display: flex;
        gap: 12px;
        padding: 12px;
        flex-wrap: wrap;
      }
      iframe {
        width: 375px;
        height: 667px;
        border: 2px solid #444;
        background: #000;
      }
      section {
        flex: 1;
        min-width: 320px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font:
          12px/1.3 ui-monospace,
          monospace;
      }
      td,
      th {
        border-bottom: 1px solid #333;
        padding: 3px 6px;
        text-align: left;
        vertical-align: top;
      }
      .ok {
        color: #6f6;
      }
      .bad {
        color: #f66;
      }
      .warn {
        color: #fc6;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Mock portal</strong>
      <span id="origins"></span>
    </header>
    <form id="f">
      <label
        >game
        <select id="game"></select
      ></label>
      <label>token <input id="token" size="14" /></label>
      <label
        >lang
        <select id="lang">
          <option>en</option>
          <option>pcm</option>
        </select></label
      >
      <label
        >iframe size
        <select id="size">
          <option value="375x667">375x667</option>
          <option value="360x640">360x640</option>
          <option value="667x375">667x375 (landscape)</option>
        </select></label
      >
      <label><input type="checkbox" id="noportal" /> omit portal param (no events expected)</label>
      <button type="submit">Load game</button>
      <button type="button" id="clear">Clear log</button>
    </form>
    <main>
      <iframe id="frame" title="game"></iframe>
      <section>
        <p>Event order: <span id="order">(none)</span> <span id="verdict"></span></p>
        <table>
          <thead>
            <tr>
              <th>t (ms)</th>
              <th>game</th>
              <th>type</th>
              <th>data</th>
            </tr>
          </thead>
          <tbody id="log"></tbody>
        </table>
        <p id="ignored" class="warn"></p>
      </section>
    </main>
    <script>
      const q = new URLSearchParams(location.search);
      const gameOrigin = q.get('gameOrigin') || 'http://localhost:4181';
      const $ = (id) => document.getElementById(id);
      $('origins').textContent = 'portal ' + location.origin + ' | games ' + gameOrigin;
      // Opaque demo token. A real portal never exposes a phone number to the game.
      $('token').value = q.get('token') ?? 'tok_' + Math.random().toString(36).slice(2, 10);
      $('lang').value = q.get('lang') ?? 'en';
      const order = [];
      let t0 = performance.now();
      let ignored = 0;

      function verdict() {
        const types = order.map((e) => e.type);
        $('order').textContent = types.join(' > ') || '(none)';
        const first = types[0] === 'ready';
        const startAfterReady =
          types.indexOf('start') === -1 || types.indexOf('start') > types.indexOf('ready');
        const endLast =
          types.indexOf('end') === -1 ||
          types.lastIndexOf('end') === types.length - 1 ||
          types
            .slice(types.indexOf('end'))
            .every((t) => t === 'end' || t === 'ready' || t === 'start');
        const ok = first && startAfterReady && endLast;
        $('verdict').textContent = types.length ? (ok ? 'order OK' : 'order PROBLEM') : '';
        $('verdict').className = ok ? 'ok' : 'bad';
      }

      window.addEventListener('message', (e) => {
        if (e.origin !== gameOrigin) return;
        const m = e.data;
        if (!m || m.source !== 'naija-games') {
          ignored++;
          $('ignored').textContent = ignored + ' non-bridge message(s) ignored';
          return;
        }
        order.push(m);
        const tr = document.createElement('tr');
        for (const v of [
          Math.round(performance.now() - t0),
          m.game,
          m.type,
          JSON.stringify(m.data),
        ]) {
          const td = document.createElement('td');
          td.textContent = String(v);
          tr.append(td);
        }
        $('log').append(tr);
        verdict();
      });

      async function populate() {
        try {
          const list = await (await fetch(gameOrigin + '/__games')).json();
          $('game').replaceChildren(...list.map((g) => new Option(g, g)));
        } catch {
          $('game').replaceChildren(new Option('(game server offline)', ''));
        }
        if (q.get('game')) $('game').value = q.get('game');
        load();
      }

      function load() {
        const game = $('game').value;
        if (!game) return;
        order.length = 0;
        $('log').replaceChildren();
        t0 = performance.now();
        verdict();
        const [w, h] = $('size').value.split('x');
        $('frame').style.width = w + 'px';
        $('frame').style.height = h + 'px';
        const u = new URL(gameOrigin + '/' + game + '/');
        if (!$('noportal').checked) u.searchParams.set('portal', location.origin);
        if ($('token').value) u.searchParams.set('token', $('token').value);
        u.searchParams.set('lang', $('lang').value);
        $('frame').src = u.href;
      }

      $('f').addEventListener('submit', (e) => {
        e.preventDefault();
        load();
      });
      $('clear').addEventListener('click', () => {
        order.length = 0;
        $('log').replaceChildren();
        verdict();
      });
      populate();
    </script>
  </body>
</html>
